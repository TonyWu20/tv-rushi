# No top-level `watch` key: a reload resets the preview panel's
# scroll position, which blocks reading a rendered message.
# Television's CLI flag `tv rushi-sessions-events --watch N`
# enables the reload for one run.

# rushi-sessions-events-branch — the branch view of the
# rushi-sessions-events channel: the same channel focused on one
# parent branch (the picked seq as the cutoff).
#
# Launched by the `branch_view` action (alt-b) of the events
# channel, in a floating pane over that view. The action hands
# the picked seq to this channel as the RUSHI_BRANCH_SEQ env
# var: the two source commands below expand it at run time (the
# sh -c wrapper, the env var inherited from the launching
# pane). A manual launch without the env var fails at the
# binary level (an empty seq is out of range).
#   RUSHI_BRANCH_SEQ=8 tv rushi-sessions-events-branch /path/to/sessions/<session>
#
# The source commands run the `rushi-sessions` binary. `rushi-sessions
# events` prints the collapsed branch view of the CWD's events.jsonl,
# newest first: the active branch plus the history before the
# diverging node. The inactive branches do not print: their spans
# fold onto the row that hides them. One TSV row per shown entry:
#   0 seq     1-based line number of the entry in events.jsonl
#   1 tag     the short marker of the entry type (at most two
#             capitalized letters, `[U]`, `[A]`, ... in the display)
#   2 ts      the local wall-clock time of the entry
#   3 summary the one-line summary with the branch annotations:
#             the `(Folded N)` count of the span that folds onto
#             the row, the `branched from #T` / `branched out to
#             #M` labels of the branch structure, and the `K
#             hidden` count of the span the rewind marker
#             abandoned (the `#N` numbers are 0-based item numbers;
#             the first entry of the log is #0)
#   4 indent  the tree-depth box connector: three spaces per level,
#             the down-pointing branch marker `┌─` (the list is
#             newest first, so a branch block sits above its target
#             and the connector runs down to it), the `+` fold
#             marker on a row that hides a span, empty on the trunk
#
# Two views: `User+Assistant` (the default, the first source command)
# lists the user and assistant messages and the rewind markers, and
# `All` lists every shown entry. Television runs the first command on
# startup and cycles the rest on Ctrl+S. The `branch_view` action
# (alt-b) opens a nested tv of the picked entry's parent branch. It
# runs the channel from a temp cable dir whose source commands are
# the `branch` view of the picked seq (`rushi-sessions events
# --branch SEQ`, with and without `--chat`), so the two focused
# views keep the Ctrl+S cycle.
#
# The list shows [tag] ts summary, indented by the tree depth of
# the branch structure (the down-pointing box connector).
# The preview panel renders the
# selected entry as a document: markdown for user_message,
# assistant_message and compaction_summary, toml for tool_call,
# tool_result and everything else. The document pipes through a
# renderer. The ts of a document is local wall-clock time. The id of
# a user_message does not print. The call ids of a tool_call (the
# id and call_id keys) do not print. This file carries the baseline: `bat` with the per-entry
# language flag and the RUSHI_PREVIEW_THEME override (default theme
# "Catppuccin Macchiato", to match the catppuccin tv theme). When bat
# is absent, the document prints plain.
#
# The home-manager module builds this channel from
# rushi-sessions-events-channel.nix with the `eventPreviewer` and
# `eventTomlPreviewer` options. They replace the bat pipe with a
# user-chosen renderer (for example `mdcat` or `glow` for the
# markdown documents). The module also exposes `eventViewer` and
# `eventTomlViewer`, the viewers of the `view_message` action
# (for example `mdfried` and `bat`). That generated form is what
# the module installs; this repo copy is the manual-install
# baseline.
#
# Requirements: `rushi-sessions` (the source and preview commands) and
# `bat` (optional: the preview falls back to plain text without it).
# The action that launches this channel needs `tv` on PATH, resolved
# like the other interactive actions. The `send_message` action needs
# `rushi`, `stty`, `mv` and `$EDITOR` (fallback `nvim`), resolved on PATH,
# like the main channel's copy. The detached loop start uses `setsid`
# when it is on PATH and falls back to `nohup` otherwise (the macOS
# base has no setsid).
# The `view_message` action needs its viewers on PATH (`mdfried`
# and `bat` in this baseline copy). The `branch_view` action needs
# `tv` on PATH, resolved like the main channel's `browse_events`.
# It also guards for this channel's file in the cable dir
# (~/.config/television/cable/rushi-sessions-events-branch.toml,
# this file when installed from the repo baseline).
#
# The `yank_entry` action (bound to ctrl-y, in place of
# television's native raw-row yank) copies the selected entry's
# full document to the clipboard. It keeps the newlines, which the
# native yank (the raw source row) drops. The fork runs the
# binary's copy-entry subcommand on the selected seq. It writes the
# OSC 52 escape to the controlling tty and pipes the document into
# a local clipboard tool when one is on PATH. It needs no new
# binary beyond rushi-sessions.
#
# The `rewind`, `summarize` and `summarize-prompt` actions (the
# tree view's options) need `rushi` on PATH: the action logic runs
# in the `rushi-sessions` binary, which calls the kernel's log
# appender (`rushi-log`, the legacy `log` of older kernels) and the
# `compact` binary (the siblings of the resolved `rushi`). Both
# need the loop to be idle: the binary probes the kernel's
# `.loop.lock` flock and refuses a live loop.
#
# When tv runs inside tmux 3.8+, the prompt runs in a floating
# pane (`tmux new-pane -f`) above tv: the editor and the send step
# run in the pane, the pane dies on exit, the panes below keep
# rendering, and the fork returns at pane creation. The floating-pane
# path adds `cat` and a second `mktemp` (the pipeline file); the
# new-pane flags used are -f, -c, -x, -y, -X, -Y, -T and the
# multi-arg command form. The pane is not modal: copy-mode, window
# switching and the prefix bindings stay available while it is open.
# Below 3.8, or outside tmux, the pane editor runs instead.

[metadata]
name = "rushi-sessions-events-branch"
description = "The branch view of a rushi session: the events channel focused on the picked entry's parent branch"
requirements = ["rushi-sessions", "rushi"]

[source]
shell = "bash"
display = "{split:\t:4}[{split:\t:1}] {split:\t:2} {split:\t:3}"
output = "{split:\t:0}"
frecency = false

[[source.command]]
# The default view (the first source command): only the user and
# assistant messages, focused on the branch. The sh -c wrapper
# expands RUSHI_BRANCH_SEQ (the picked seq, set by the launching
# branch_view action) at run time. The binary reads the CWD's
# events.jsonl.
name = "User+Assistant"
run = "sh -c 'rushi-sessions events --branch \"$RUSHI_BRANCH_SEQ\" --chat'"

[[source.command]]
# Every entry of the focused branch.
name = "All"
run = "sh -c 'rushi-sessions events --branch \"$RUSHI_BRANCH_SEQ\"'"

[preview]
shell = "bash"
cached = true
# Plain document from the binary, then the renderer. The shell asks the
# binary for the language once (--print-lang) and picks the bat
# language flag. The theme override reads RUSHI_PREVIEW_THEME when set.
# A missing bat falls back to the plain document.
command = """
sh -c 'q=$1; l=$(rushi-sessions event-preview . \"$q\" --print-lang); t=$RUSHI_PREVIEW_THEME; if command -v bat >/dev/null 2>&1; then if [ -n \"$t\" ]; then th=\"--theme $t\"; else th=\"\"; fi; if [ \"$l\" = toml ]; then rushi-sessions event-preview . \"$q\" | bat --color=always -l toml --style=plain $th; else rushi-sessions event-preview . \"$q\" | bat --color=always -l markdown --style=plain $th; fi; else rushi-sessions event-preview . \"$q\"; fi' sh '{split:\t:0}'
"""

[ui]
orientation = "portrait"

[ui.preview_panel]
size = 62

[keybindings]
ctrl-t = "actions:send_message"
alt-b = "actions:branch_view"
alt-r = "actions:rewind"
alt-s = "actions:summarize"
alt-p = "actions:summarize-prompt"
enter = "actions:view_message"
# Replaces the native ctrl-y, which copies the raw source row
# (one line, tab-separated).
ctrl-y = "actions:yank_entry"

# The session dir is the CWD of this channel: television chdirs to the
# [PATH] argument, and the main channel's browse_events action starts
# the nested tv in the session dir. The fork of this action inherits
# it. The source rows carry only the seq token, so the command takes
# no split placeholder.
#
# The action logic runs in the rushi-sessions binary: `--events` mode
# resolves the session dir from the CWD, reads the recorded working dir
# (the `cwd` file, or the project dir when the file is missing), runs
# the editor in a floating pane (tmux 3.8+) or in the fork's pane,
# then one detached `rushi run` for both loop states: the kernel
# branches on the session lock, a live loop drains the appended
# message, an idle session starts the loop. When the project dir
# carries a `flake.nix` and nix is on PATH, the detached call runs
# in that devShell (`nix develop -c rushi run ...`, decision 87/88).
# The devShell shadows the inherited PATH, so a binary the devShell
# does not ship falls back to the PATH `rushi`.
[actions.send_message]
description = "Open $EDITOR (falling back to nvim) on a message file, then send the result to the session with one detached `rushi run <session> <msg>` call, run in the session's recorded working dir. The kernel branches on the session lock itself: a live loop drains the appended message, an idle session starts the loop. An empty message cancels. When tv runs inside tmux 3.8+, the editor and the send step run in a floating pane (`tmux new-pane -f`) above tv: the pane closes when the step exits, and the panes below keep rendering. Copy-mode and window switching stay available while the pane is open. Outside tmux, or on tmux below 3.8, the editor opens in the fork's pane as before. The prompt file carries a .md extension, so $EDITOR applies the markdown filetype. The editor opens in the session's recorded working dir, so typed relative paths complete against it. When the project dir carries a flake and nix is on PATH, the detached call runs in that devShell (`nix develop -c rushi run ...`, decision 87/88). The devShell shadows the inherited PATH, so a binary the devShell does not ship falls back to the PATH `rushi`. The action logic runs in the rushi-sessions binary: the pane's command is the binary itself, so no shell quoting crosses the tmux boundary."
shell = "bash"
mode = "fork"
# The source rows carry only the seq token, so the command takes no
# split placeholder. It stays brace-free: television's string pipeline
# treats a stray {group} as a template token. The binary resolves the
# session dir from the CWD (the channel CWD is the session dir).
command = "rushi-sessions send-message --events"

[actions.view_message]
# The fork pipes the selected entry's document into a viewer chosen
# from the entry's language and runs it in the pane: the viewer
# takes over the pane, then television resumes when it exits. The
# source rows carry the seq token, so the body takes one split
# placeholder, {split:\t:0}. The body asks the binary for the
# language once (--print-lang), then branches: markdown to the
# markdown viewer, toml to the toml viewer. This baseline copy
# pipes markdown into mdfried and toml into bat. The
# home-manager module exposes the viewers as the `eventViewer` and
# `eventTomlViewer` options.
description = """
View the selected entry in the channel's viewer. The fork picks the viewer from the entry's language: markdown goes to the eventViewer, toml goes to the eventTomlViewer. The viewer takes over the pane, and television resumes when the viewer exits. The baseline copy pipes markdown into mdfried and toml into bat. Set the options of the rushi-sessions home-manager module to pick the viewers.
"""
shell = "bash"
mode = "fork"
command = """
sh -c 'q=$1; l=$(rushi-sessions event-preview . \"$q\" --print-lang); if [ \"$l\" = toml ]; then rushi-sessions event-preview . \"$q\" | bat; else rushi-sessions event-preview . \"$q\" | mdfried; fi' sh '{split:\t:0}'
"""

[actions.yank_entry]
# Copies the selected entry's full document to the clipboard,
# newlines preserved. The native ctrl-y copies the raw source row
# instead, one tab-separated line. The fork runs the binary's
# copy-entry subcommand on the selected seq. It writes the OSC 52
# escape to the controlling tty and pipes the document into a
# local clipboard tool when one is on PATH. The source rows carry
# only the seq token, so the command takes one split placeholder.
description = "Copy the selected entry's full document (newlines preserved) to the clipboard. The fork runs the binary's copy-entry subcommand. It renders the entry the way event-preview does: markdown for messages, toml for everything else. The OSC 52 terminal clipboard escape is written to the controlling tty first. A supporting terminal, or tmux 3.8+ with set-clipboard on, lands it on the system clipboard. A local clipboard tool (pbcopy, wl-copy, xclip, xsel) takes the pipe when one is on PATH."
shell = "bash"
mode = "fork"
command = "rushi-sessions copy-entry . '{split:\t:0}'"

[actions.rewind]
# Rewinds the session to the selected event, the rushi-tui tree
# view's `Rewind without summary` option. The fork runs the binary
# with the selected seq: it validates the seq, probes the kernel's
# `.loop.lock` flock, and appends the `rewind` marker through the
# kernel's log appender (`rushi-log`, legacy `log`). The loop
# applies it on its next step.
# A user_message pick rewinds before it, every other type on it.
description = """
Rewind the session to the selected event, without a summary (the tree view's `Rewind without summary` option). The binary validates the seq, checks that the loop is idle through the kernel's .loop.lock flock, and appends the rewind marker with the kernel's log appender (`rushi-log`, the legacy `log` of older kernels). A user_message pick rewinds before it; every other type rewinds on it. If the loop is live, the binary exits without writing; the loop applies the marker on its next step.
"""
shell = "bash"
mode = "fork"
command = "rushi-sessions rewind '{split:\t:0}'"

[actions.summarize]
# One-shot fork-and-summarize, the rushi-tui tree view's `Summarize
# the branch` option (rushi-tui #37/#38). The fork runs the binary
# with the selected seq: it appends the `rewind` marker at the pick
# (mode `on`: the picked event stays in the context) and runs the
# kernel's `compact` binary with `--branch` on the open span the
# marker abandons. No pre-existing marker is needed.
description = """
One-shot: append a rewind marker at the picked event (the picked event stays in the context), then summarize the abandoned branch with the kernel's compact binary (--branch) in the session's recorded working dir (the tree view's `Summarize the branch` option). No pre-existing rewind marker is needed. The loop applies the summary on its next step.
"""
shell = "bash"
mode = "fork"
command = "rushi-sessions summarize '{split:\t:0}'"

[actions.summarize-prompt]
# The `Summarize with custom prompt` option (the one-shot with a
# prompt, rushi-tui #37/#38): the binary opens the editor for one
# instruction line (the same prompt flow as `send_message`), then
# appends the `rewind` marker at the pick and runs the kernel's
# `compact` binary with `--branch --prompt TEXT`. A blank file
# cancels (no marker is appended).
description = """
One-shot with a custom prompt (the tree view's `Summarize with custom prompt` option): open the editor for one instruction line (the same prompt flow as the send action; a blank file cancels and appends no marker), then append a rewind marker at the picked event and run the kernel's compact binary with --branch and --prompt in the session's recorded working dir.
"""
shell = "bash"
mode = "fork"
command = "rushi-sessions summarize '{split:\t:0}' --prompt"
[actions.branch_view]
# Open the picked entry's parent branch in a nested tv: the
# branch channel (rushi-sessions-events-branch) focused on the
# picked seq. The pane command hands the seq to the nested tv
# as the RUSHI_BRANCH_SEQ env var, which the branch channel's
# two source views expand: both views and the ctrl-s cycle stay
# in the nested view. When tv runs inside tmux, the nested tv
# runs in a floating pane over the tv window (tmux new-pane -f,
# the tmux 3.8+ tier; the pane lookup keeps the control-char -F
# format of the main channel's browse_events): centered, 62%
# width and 90% height, labeled `rushi branch view`. The pane
# dies when the nested tv exits, restoring this view without a
# layout change. When the floating pane is unavailable (older
# tmux), the split below the newest pane is used; outside tmux
# it runs in the fork's pane. The action guards for the branch
# channel file in the cable dir.
description = "Open the selected entry's parent-branch view in a nested tv: the rushi-sessions-events-branch channel focused on the picked seq, the collapsed view of the parent branch with the picked entry as the cutoff. When tv runs inside tmux, a floating pane over the tv window runs it from the session dir (the tmux 3.8+ tier; the split-pane fallback on older tmux). Otherwise it runs in this fork. The rewind, summarize and send_message actions work in the nested view. Close the nested tv (esc or ctrl-c) to return to this view."
shell = "bash"
mode = "fork"
command = """
sh -c 's=$1; rp=$(pwd 2>/dev/null);
if [ -z \"$rp\" ]; then echo \"rushi-sessions-events: the channel CWD is gone; re-open the channel\" >&2; exit 1; fi;
bf=\"$HOME/.config/television/cable/rushi-sessions-events-branch.toml\";
if [ ! -f \"$bf\" ]; then echo \"rushi-sessions-events: the branch channel is not installed; rebuild the television channels\" >&2; exit 1; fi;
t=$TMUX;
if [ -n \"$t\" ] && command -v tmux >/dev/null; then
  ob=$(printf \"\\173\"); cb=$(printf \"\\175\"); F=\"#\"$ob\"pane_id\"$cb\" \"\"#\"$ob\"pane_floating_flag\"$cb; pn=$(tmux list-panes -F \"$F\" | sed \"/ 0\\$/!d; s/ .*//; s/^%//\" | sort -n | tail -1);
  if [ -n \"$pn\" ] && tmux new-pane -f -c \"$rp\" -x \"62%\" -y \"90%\" -X \"19%\" -Y \"5%\" -T \"rushi branch view\" -t \"%$pn\" env \"RUSHI_BRANCH_SEQ=$s\" tv rushi-sessions-events-branch; then
    :;
  elif [ -n \"$pn\" ]; then
    tmux split-window -h -l \"62%\" -c \"$rp\" -t \"%$pn\" env \"RUSHI_BRANCH_SEQ=$s\" tv rushi-sessions-events-branch;
  else
    tmux split-window -h -l \"62%\" -c \"$rp\" env \"RUSHI_BRANCH_SEQ=$s\" tv rushi-sessions-events-branch;
  fi;
else
  RUSHI_BRANCH_SEQ=\"$s\" tv rushi-sessions-events-branch;
fi' sh '{split:\t:0}'
"""