# rushi-sessions — a television channel that peeks at rushi sessions.
#
# Source of truth: /home/tony/programming/tv-rushi/rushi-sessions.toml
# Installed copy : ~/.config/television/cable/rushi-sessions.toml
# Reinstall      : cp /home/tony/programming/tv-rushi/rushi-sessions.toml \
#                     ~/.config/television/cable/rushi-sessions.toml
#
# Usage:
#   tv rushi-sessions [DIR]
#     DIR is television's [PATH] argument. tv chdirs into DIR before the
#     source command runs, so the scan root is:
#       - your current directory when DIR is omitted
#       - DIR when given, e.g. tv rushi-sessions ~/programming or /
#
# The binary takes optional scan roots: `rushi-sessions source ROOT...`.
# Each source command under [source] passes a different ROOT set to the
# same binary, so no flags are stacked. `CWD` passes no roots (the binary
# scans the CWD). Add `Local` and `All` commands to watch fixed trees.
# Home-manager users set the `programs."rushi-sessions".sourceRoots`
# option instead; the module generates these commands for them.
#
# The source commands run the `rushi-sessions` binary (one process per run).
# One `fd` call finds the session roots, then the same process does the rest:
# liveness via kill(pid, 0), last loop_phase from a tail read of
# events.jsonl, mtime for last-activity. No per-session forks. The scan
# roots are the ones the source command passes (below); without roots
# the binary scans the CWD. The binary prints one
# tab-separated line per session:
#   0 status  ACTIVE (live loop.pid) or IDLE
#   1 name    session name
#   2 repo    parent dir of the sessions/ dir (remote rows: host: prefix)
#   3 phase   last loop_phase from events.jsonl
#   4 last    last activity, mm-dd HH:MM
#   5 epoch   last activity, unix seconds (hidden sort key)
#   6 abs     absolute path to the session dir (used by preview/actions)
#
# The list shows status, repo/name, phase, last activity; remote rows
# carry the host in the repo field. The preview shows a status card
# (a `host` row under `repo` for remote rows, a `branch` row for
# the git branch of the session's working dir when one resolves),
# the full last user message, the last on-idle assistant message,
# and a recent-events table.
# Full interaction happens in rushi-tui (the open action). The channel
# is a peek plus a message poke:
# send_message (ctrl-t) opens $EDITOR, then pokes the session with one
# detached `rushi run` call in the session's recorded working dir. The
# kernel branches on the session lock: a live loop drains the appended
# message, an idle session starts the loop.
# new_session (alt-n) opens $EDITOR, then creates a sibling session in
# the entry's project dir: detached `rushi run NAME MSG --sessions-root
# <project>/sessions` (rushi 0.1.1+; the working dir is the sessions
# root's parent). An empty message creates the session idle.
# run_loop (no keybinding) drives an idle session: one detached
# `rushi run` call, no task (decisions 104, 105). No message is
# logged. The step runs in the session's recorded working dir,
# detached in its own session (the binary's `setsid(2)` spawn,
# decision 102, not the macOS-missing `setsid` tool). `rushi`
# resolves on PATH.
#
# Requirements: `fd` (hard, the binary's walk) and `rushi-sessions`
# (the backend binary, built by this repo's flake). `bat` is optional:
# the preview falls back to plain markdown when bat is absent. The interactive
# actions call binaries resolved on PATH, which are not listed as core
# requirements: `rushi` for send_message and new_session (0.1.1+ for the flags), `rushi-tui` for open/open_v,
# and `tmux` for open, open_v, open_dir_tmux_h and open_dir_tmux_v
# When the session's working dir (the recorded `cwd`, the project dir
# fallback) carries a flake and nix is on PATH, the open actions run
# `rushi-tui` in that devShell and the send/create actions run
# `rushi run` in it; the remote rows run the same checks on the
# remote host and use its devShell (decision 87/88, 93). The devShell
# shadows the inherited PATH, so a binary the devShell does not ship
# falls back to the inherited PATH entry.
# (used only when tv runs inside a tmux session; each detects $TMUX and
# falls back to the plain fork without it). `tv` itself for
# browse_events, which launches the nested rushi-sessions-events
# channel. That nested channel needs its own cable file
# (`rushi-sessions-events.toml`) and the `rushi-sessions` binary.
# send_message and new_session use `mktemp`, `mv`, `stty`, `tr`
# and $EDITOR (fallback `nvim`). The detached loop start enters its
# own session inside the binary (`setsid`, decision 102), with
# stdio to /dev/null. No detach tool is needed on PATH.
# new_session adds `sed`, `head`, `tail` and
# `base64` (remote rows). All are in the standard Unix base.
# When tv runs inside tmux 3.8+, send_message and new_session prompt
# in a `tmux new-pane` floating pane: the editor and the rushi-run
# step run in the pane, the pane dies on exit, the panes below keep
# rendering, and the fork returns at pane creation. The pane path
# adds `cat` and a second `mktemp` (the pipeline file); the
# new-pane flags used are -f, -c, -x, -y, -X, -Y, -T and the
# multi-arg command form. The pane is not modal: copy-mode, window
# switching and the prefix bindings stay available while it is open.
# Below tmux 3.8, or outside tmux, both fall back to the plain fork.
#
# Remote roots: a source root may be `host:/path` or `user@host:/path`
# (an ssh alias). The binary runs the remote `rushi-sessions` over ssh
# and prefixes those rows' repo and path columns with `host:`. The
# actions branch on that prefix. The open actions split a pane in the
# LOCAL tmux server and run the remote TUI over `ssh -t`; the other
# actions act over `ssh -T`. This needs `ssh` plus the same
# `rushi-sessions` and `rushi` on the remote host. The open actions
# additionally need `rushi-tui` there, the open_dir_tmux actions need
# `tmux` there, and browse_events needs `tv` and this channel deployed
# there. A non-interactive ssh does not source the shell init, so a
# Nix profile on the remote is not on PATH. Set
# RUSHI_SESSIONS_REMOTE_BIN on the remote to name the binary, or use
# an absolute path.
#
# shell = "bash" is set on every command. television detects the login
# shell from $SHELL (fish here) and would otherwise run these commands
# under fish. The binary output carries real tabs; the string-pipeline
# templates split on that real tab (a TOML \t escape below becomes a real
# tab at parse time, matching the source output).

[metadata]
name = "rushi-sessions"
description = "Peek at rushi sessions: status, loop phase, last activity"
requirements = ["fd", "rushi-sessions"]

[source]
shell = "bash"
# One rushi-sessions process per run. Internally: one fd call finds the
# session roots (fast, parallel walk), then per-session liveness, phase
# and mtime in-process. No per-session forks.
#
# Named source commands: television runs the first on startup and cycles
# the rest on Ctrl+S (the `cycle_sources` keybinding). Each command passes
# a different ROOT set to the same binary, so no flags are stacked. This
# shipped copy is rootless, so it ships the single `CWD` command. Add
# `Local` and `All` commands (examples below) to enable the root views.
display = "[{split:\t:0}] {split:\t:2}/{split:\t:1} [{split:\t:3}] {split:\t:4}"
output = "{split:\t:6}"
# Keep the source order of the rows, including the rows a typed
# query filters to. The binary prints them newest-mtime first, so
# the list and every query result show the most recently updated
# sessions on top. Without this, television re-ranks fuzzy matches
# by match score and the update-time order is lost.
no_sort = true
# The frecency re-ranking is also off: it would float the most
# often opened sessions to the top and break the time order.
frecency = false

[[source.command]]
# No scan roots: the binary scans the CWD.
name = "CWD"
run = "rushi-sessions source"

# Root views. Uncomment and add your roots to enable them. `Local` takes
# only the local roots; `All` takes the local + remote roots. A remote
# root is host:/path or user@host:/path (an ssh alias).
#
# [[source.command]]
# name = "Local"
# run = "rushi-sessions source /export ~/Downloads"
#
# [[source.command]]
# name = "All"
# run = "rushi-sessions source /export ~/Downloads build:/export"

[preview]
shell = "bash"
cached = true
# Two preview commands, cycled with the cycle_previews action
# (Ctrl+F by default, decision 99): the session card, then the
# recent-events table view. Both are structured markdown documents,
# syntax-highlighted by bat when it is on PATH (theme override:
# RUSHI_PREVIEW_THEME, default "Catppuccin Macchiato" to match the
# catppuccin tv theme). The card key table closes with two
# truncated message rows: the last user message and the last
# on-idle assistant message, each clipped to 400 chars (decision
# 101). The events view shows the key table plus the recent-events
# table (the last 20 meaningful events, newest first). Both fall
# back to plain markdown when bat is absent. Home-manager users
# pick another renderer with
# programs."rushi-sessions".sessionPreviewer: the channel then pipes
# the plain document (--plain) into that command line. This repo
# copy is the bat baseline.
command = [
  "rushi-sessions preview '{split:\t:0}' '{split:\t:1}' '{split:\t:2}' '{split:\t:3}' '{split:\t:4}' '{split:\t:5}' '{split:\t:6}'",
  "rushi-sessions preview --events '{split:\t:0}' '{split:\t:1}' '{split:\t:2}' '{split:\t:3}' '{split:\t:4}' '{split:\t:5}' '{split:\t:6}'",
]

[ui]
orientation = "portrait"

[ui.preview_panel]
size = 62

[keybindings]
ctrl-e = "actions:open"
ctrl-v = "actions:open_v"
alt-o = "actions:open_dir"
alt-d = "actions:open_dir_tmux_h"
alt-v = "actions:open_dir_tmux_v"
ctrl-t = "actions:send_message"
alt-k = "actions:kill"
enter = "actions:browse_events"
alt-e = "actions:browse_events_v"
alt-n = "actions:new_session"

[actions.open]
# The TUI resolves a bare session name against a *relative*
# sessions_root, so it must start in the directory that contains the
# sessions tree. That dir is the session's recorded working dir (the
# `cwd` file in the session dir, where its tools run): the file's
# value is used as-is, with no walk-up. The path-based
# dirname(dirname(session_dir)) stays the fallback for a missing or
# stale `cwd` file. The session dir is handed to the TUI as an
# absolute path (rushi-tui issue #31: an explicit session dir is
# used as-is), so the session's identity survives wherever the
# sessions tree lives: a git worktree without a `sessions` symlink
# keeps the session dir in the main worktree's tree while the
# session works in the worktree. Remote rows resolve the dir on the
# remote host with one `ssh -T` call.
#
# tv forks this action, so the fork inherits the pane environment.
# When tv runs inside tmux, TMUX is set: create a new pane in the
# current window. The split targets the newest pane of the window,
# not the tv pane. tmux pane ids are monotonic per server. The
# largest live id is the newest pane. The first open lands next to
# tv. Each later open stacks next to the pane it created. Floating
# prompt panes are excluded from the lookup, so a send_message or
# new_session pane never wins. The pane starts in the working dir (-c).
# It runs rushi-tui there. The pane closes when rushi-tui exits.
# The pane command cds to the resolved dir itself: a tmux server
# whose own cwd was deleted fails its getcwd, and tmux (3.7) skips
# the -c chdir for every new pane on such a server. The explicit cd
# keeps the pane anchored. The newest-pane lookup builds its tmux
# format at runtime from the printf octal escapes. A literal brace
# group would break the television template pass. An empty lookup
# falls back to the tmux default target, the active pane. Outside
# tmux, or when the tmux binary is missing, keep the original
# behavior: it runs `cd` to the working dir, then rushi-tui
# in this fork.
#
# A remote row (host: prefix) also opens a pane in the LOCAL tmux
# server, never on the remote one. The pane runs
# `ssh -t HOST "cd WORKDIR && rushi-tui SESSION_DIR"`: the
# remote TUI shows up next to tv, and the pane closes when it exits.
# No tmux server is needed on the remote host (the old behavior
# spawned a pane on the remote server, invisible to the user). Outside
# local tmux the fork
# runs the ssh command directly. The remote host needs `rushi-tui`
# reachable by a non-interactive ssh.
#
# The shell body stays brace-free: television's string pipeline treats a
# stray {group} as a template token and then leaves the {split:\t:6}
# placeholder unsubstituted. That is why the check reads plain $TMUX
# instead of ${TMUX:-}.
description = "Open this session in rushi-tui. The TUI starts in the session's recorded working dir (the `cwd` file in the session dir), falling back to the session's project dir when the file is missing or stale. The session dir is handed to the TUI as an absolute path, so the sessions tree may live elsewhere (a git worktree). Inside tmux, a new pane to the right of the newest pane in the tv window runs it. Outside tmux, it runs in this fork. Remote rows open the pane in the local tmux server: the pane runs the remote TUI over ssh -t. When the working dir's `.envrc` (or the first one up the parent chain) names a flake and nix is on PATH, local rows run the TUI in that flake's devShell; with no `.envrc` found the PATH `rushi-tui` is used (decision 95). Remote rows do the same on the remote host when the remote working dir carries a flake and nix is reachable there (decision 87/88, 93); a failed gate falls back to the PATH `rushi-tui`."
shell = "bash"
mode = "fork"
command = """
sh -c 's=\"$1\"; host=\"\"; rp=\"$s\"; h=$(printf \"%s\" \"$s\" | cut -d: -f1); if [ \"$h\" != \"$s\" ]; then case \"$h\" in */*) : ;; *) host=\"$h\"; rp=$(printf \"%s\" \"$s\" | cut -d: -f2-);; esac; fi; if [ -n \"$host\" ]; then r=$(ssh -T \"$host\" \"w=\\$(cat \\\"$rp/cwd\\\" 2>/dev/null); [ -d \\\"\\$w\\\" ] || w=\\$(dirname \\\"\\$(dirname \\\"$rp\\\")\\\"); printf \\\"%s\\\" \\\"\\$w\\\"\"); rt=rushi-tui; rf=$(ssh -T \"$host\" \"test -f \\\"$r/flake.nix\\\" && command -v nix >/dev/null 2>&1 && echo yes\" 2>/dev/null); [ -n \"$rf\" ] && rt=\"nix develop -c rushi-tui\"; t=$TMUX; if [ -n \"$t\" ] && command -v tmux >/dev/null; then ob=$(printf \"\\173\"); cb=$(printf \"\\175\"); F=\"#\"$ob\"pane_id\"$cb\" \"\"#\"$ob\"pane_floating_flag\"$cb; pn=$(tmux list-panes -F \"$F\" | sed \"/ 0\\$/!d; s/ .*//; s/^%//\" | sort -n | tail -1); if [ -n \"$pn\" ]; then tmux split-window -h -l \"62%\" -t \"%$pn\" \"ssh -t $host \\\"cd $r && $rt \\\\\\\"$rp\\\\\\\"\\\"\"; else tmux split-window -h -l \"62%\" \"ssh -t $host \\\"cd $r && $rt \\\\\\\"$rp\\\\\\\"\\\"\"; fi; else ssh -t \"$host\" \"cd $r && $rt \\\"$rp\\\"\"; fi; else r=$(dirname \"$(dirname \"$rp\")\"); w=$(cat \"$rp/cwd\" 2>/dev/null); [ -d \"$w\" ] && r=$w; tu=rushi-tui; fd=\"\"; d=$r; while :; do if [ -f \"$d/.envrc\" ]; then ref=$(sed -n \"s/^use flake[[:blank:]]*//p\" \"$d/.envrc\" | head -n1); if [ -z \"$ref\" ] || [ \"$ref\" = \".\" ]; then fd=$d; else case $ref in \"~/\"*) fd=\"$HOME/${ref:2}\";; \"~\") fd=$HOME;; /*) fd=$ref;; *) fd=$d/$ref;; esac; fi; break; fi; [ \"$d\" = \"/\" ] && break; d=$(dirname \"$d\"); done; [ -n \"$fd\" ] && command -v nix >/dev/null 2>&1 && tu=\"nix develop $fd -c rushi-tui\"; t=$TMUX; if [ -n \"$t\" ] && command -v tmux >/dev/null; then ob=$(printf \"\\173\"); cb=$(printf \"\\175\"); F=\"#\"$ob\"pane_id\"$cb\" \"\"#\"$ob\"pane_floating_flag\"$cb; pn=$(tmux list-panes -F \"$F\" | sed \"/ 0\\$/!d; s/ .*//; s/^%//\" | sort -n | tail -1); if [ -n \"$pn\" ]; then tmux split-window -h -l \"62%\" -c \"$r\" -t \"%$pn\" \"cd \\\"$r\\\" && $tu \\\"$rp\\\"\"; else tmux split-window -h -l \"62%\" -c \"$r\" \"cd \\\"$r\\\" && $tu \\\"$rp\\\"\"; fi; else cd \"$r\" && $tu \"$rp\"; fi; fi' sh '{split:\t:6}'
"""

[actions.open_v]
# Same as open, but the split is below the newest pane instead of to
# its right. tmux's flags are easy to mix up: -v puts the new pane
# below the target pane (a horizontal divider). The remote-row
# behavior is the same ssh -t local pane, with the -v split.
description = "Open this session in rushi-tui. The TUI starts in the session's recorded working dir (the `cwd` file in the session dir), falling back to the session's project dir when the file is missing or stale. The session dir is handed to the TUI as an absolute path, so the sessions tree may live elsewhere (a git worktree). Inside tmux, a new pane below the newest pane in the tv window runs it. Outside tmux, it runs in this fork. Remote rows open the pane in the local tmux server: the pane runs the remote TUI over ssh -t. When the working dir's `.envrc` (or the first one up the parent chain) names a flake and nix is on PATH, local rows run the TUI in that flake's devShell; with no `.envrc` found the PATH `rushi-tui` is used (decision 95). Remote rows do the same on the remote host when the remote working dir carries a flake and nix is reachable there (decision 87/88, 93); a failed gate falls back to the PATH `rushi-tui`."
shell = "bash"
mode = "fork"
command = """
sh -c 's=\"$1\"; host=\"\"; rp=\"$s\"; h=$(printf \"%s\" \"$s\" | cut -d: -f1); if [ \"$h\" != \"$s\" ]; then case \"$h\" in */*) : ;; *) host=\"$h\"; rp=$(printf \"%s\" \"$s\" | cut -d: -f2-);; esac; fi; if [ -n \"$host\" ]; then r=$(ssh -T \"$host\" \"w=\\$(cat \\\"$rp/cwd\\\" 2>/dev/null); [ -d \\\"\\$w\\\" ] || w=\\$(dirname \\\"\\$(dirname \\\"$rp\\\")\\\"); printf \\\"%s\\\" \\\"\\$w\\\"\"); rt=rushi-tui; rf=$(ssh -T \"$host\" \"test -f \\\"$r/flake.nix\\\" && command -v nix >/dev/null 2>&1 && echo yes\" 2>/dev/null); [ -n \"$rf\" ] && rt=\"nix develop -c rushi-tui\"; t=$TMUX; if [ -n \"$t\" ] && command -v tmux >/dev/null; then ob=$(printf \"\\173\"); cb=$(printf \"\\175\"); F=\"#\"$ob\"pane_id\"$cb\" \"\"#\"$ob\"pane_floating_flag\"$cb; pn=$(tmux list-panes -F \"$F\" | sed \"/ 0\\$/!d; s/ .*//; s/^%//\" | sort -n | tail -1); if [ -n \"$pn\" ]; then tmux split-window -v -l \"62%\" -t \"%$pn\" \"ssh -t $host \\\"cd $r && $rt \\\\\\\"$rp\\\\\\\"\\\"\"; else tmux split-window -v -l \"62%\" \"ssh -t $host \\\"cd $r && $rt \\\\\\\"$rp\\\\\\\"\\\"\"; fi; else ssh -t \"$host\" \"cd $r && $rt \\\"$rp\\\"\"; fi; else r=$(dirname \"$(dirname \"$rp\")\"); w=$(cat \"$rp/cwd\" 2>/dev/null); [ -d \"$w\" ] && r=$w; tu=rushi-tui; fd=\"\"; d=$r; while :; do if [ -f \"$d/.envrc\" ]; then ref=$(sed -n \"s/^use flake[[:blank:]]*//p\" \"$d/.envrc\" | head -n1); if [ -z \"$ref\" ] || [ \"$ref\" = \".\" ]; then fd=$d; else case $ref in \"~/\"*) fd=\"$HOME/${ref:2}\";; \"~\") fd=$HOME;; /*) fd=$ref;; *) fd=$d/$ref;; esac; fi; break; fi; [ \"$d\" = \"/\" ] && break; d=$(dirname \"$d\"); done; [ -n \"$fd\" ] && command -v nix >/dev/null 2>&1 && tu=\"nix develop $fd -c rushi-tui\"; t=$TMUX; if [ -n \"$t\" ] && command -v tmux >/dev/null; then ob=$(printf \"\\173\"); cb=$(printf \"\\175\"); F=\"#\"$ob\"pane_id\"$cb\" \"\"#\"$ob\"pane_floating_flag\"$cb; pn=$(tmux list-panes -F \"$F\" | sed \"/ 0\\$/!d; s/ .*//; s/^%//\" | sort -n | tail -1); if [ -n \"$pn\" ]; then tmux split-window -v -l \"62%\" -c \"$r\" -t \"%$pn\" \"cd \\\"$r\\\" && $tu \\\"$rp\\\"\"; else tmux split-window -v -l \"62%\" -c \"$r\" \"cd \\\"$r\\\" && $tu \\\"$rp\\\"\"; fi; else cd \"$r\" && $tu \"$rp\"; fi; fi' sh '{split:\t:6}'
"""

[actions.open_dir]
# Exit tv and land in a shell at the session's recorded working dir
# (the `cwd` file in the session dir, where the session's tools
# run): the file's value is used as-is, with no walk-up. The
# path-based dirname(dirname(session_dir)) stays the fallback for a
# missing or stale `cwd` file: a git worktree without a `sessions`
# symlink keeps the session dir in the main worktree's tree while
# the session works in the worktree; the shell lands in the
# worktree, where the session's relative paths complete.
# Uses mode = "execute" so tv quits and the command takes over the
# terminal; a fork would cd in a dead child and tv would just resume.
# Falls back to bash when $SHELL is unset.
description = "Exit tv and cd into the session's recorded working dir (the `cwd` file in the session dir); a $SHELL shell (bash fallback) takes over the terminal. A missing or stale `cwd` file lands in the session's project dir. Remote rows cd on the remote host over ssh -t."
shell = "bash"
mode = "execute"
command = """
sh -c 's=\"$1\"; host=\"\"; rp=\"$s\"; h=$(printf \"%s\" \"$s\" | cut -d: -f1); if [ \"$h\" != \"$s\" ]; then case \"$h\" in */*) : ;; *) host=\"$h\"; rp=$(printf \"%s\" \"$s\" | cut -d: -f2-);; esac; fi; sh2=$SHELL; [ -n \"$sh2\" ] || sh2=bash; if [ -n \"$host\" ]; then r=$(ssh -T \"$host\" \"w=\\$(cat \\\"$rp/cwd\\\" 2>/dev/null); [ -d \\\"\\$w\\\" ] || w=\\$(dirname \\\"\\$(dirname \\\"$rp\\\")\\\"); printf \\\"%s\\\" \\\"\\$w\\\"\"); ssh -t \"$host\" \"cd \\\"$r\\\" && exec $sh2\"; else r=$(dirname \"$(dirname \"$rp\")\"); w=$(cat \"$rp/cwd\" 2>/dev/null); [ -d \"$w\" ] && r=$w; cd \"$r\" && exec \"$sh2\"; fi' sh '{split:\t:6}'
"""

[actions.open_dir_tmux_h]
# Open a shell at the session's recorded working dir (the `cwd` file
# in the session dir) in a tmux pane: the file's value is used
# as-is, with no walk-up. The dirname(dirname(session_dir)) path
# rule stays the fallback for a missing or stale `cwd` file, as in
# open_dir. The shell is $SHELL, with a bash fallback when $SHELL
# is unset.
#
# tv forks this action, so the fork inherits the pane environment.
# When tv runs inside tmux, TMUX is set: create a new pane in the
# current window. The split targets the newest pane of the window,
# not the tv pane. The first open lands next to tv. Each later open
# stacks next to the pane it created. Floating prompt panes are
# excluded from the lookup. The pane starts in the working dir (-c).
# It runs the shell there. The pane closes when the shell exits. tmux
# runs the pane command through its default shell, so the pane
# command is the plain shell path. The pane command cds to the
# resolved dir first: a tmux server whose own cwd was deleted fails
# its getcwd, and tmux (3.7) skips the -c chdir for every new pane
# on such a server. The explicit cd keeps the pane anchored. The
# newest-pane lookup stays brace-free, as in open. An empty lookup
# falls back to the tmux default target, the active pane. Outside
# tmux, or when the tmux binary is missing, the fork cds to the
# working dir and execs the shell; tv resumes when the shell exits.
#
# A remote row (host: prefix) also opens a pane in the LOCAL tmux
# server, never on the remote one. The pane runs
# `ssh -t HOST "cd REPO && exec SHELL"`: a shell at the remote project
# dir shows up next to tv. No remote tmux server is needed. Outside
# local tmux the fork runs the ssh command directly. The shell name is
# the local $SHELL value (bash fallback), matching the old remote branch.
#
# The shell body stays brace-free: television's string pipeline treats a
# stray {group} as a template token and then leaves the {split:\t:6}
# placeholder unsubstituted. That is why the check reads plain $TMUX
# instead of ${TMUX:-}.
description = "Open a $SHELL shell (bash fallback) in the session's recorded working dir (the `cwd` file in the session dir). Inside tmux, a new pane to the right of the newest pane in the tv window runs it. Outside tmux, it runs in this fork. tv resumes when the shell exits. A missing or stale `cwd` file lands in the session's project dir. Remote rows open the pane in the local tmux server: the pane runs the remote shell over ssh -t."
shell = "bash"
mode = "fork"
command = """
sh -c 's=\"$1\"; host=\"\"; rp=\"$s\"; h=$(printf \"%s\" \"$s\" | cut -d: -f1); if [ \"$h\" != \"$s\" ]; then case \"$h\" in */*) : ;; *) host=\"$h\"; rp=$(printf \"%s\" \"$s\" | cut -d: -f2-);; esac; fi; sh2=$SHELL; [ -n \"$sh2\" ] || sh2=bash; if [ -n \"$host\" ]; then r=$(ssh -T \"$host\" \"w=\\$(cat \\\"$rp/cwd\\\" 2>/dev/null); [ -d \\\"\\$w\\\" ] || w=\\$(dirname \\\"\\$(dirname \\\"$rp\\\")\\\"); printf \\\"%s\\\" \\\"\\$w\\\"\"); c=\"cd $r && exec $sh2\"; t=$TMUX; if [ -n \"$t\" ] && command -v tmux >/dev/null; then ob=$(printf \"\\173\"); cb=$(printf \"\\175\"); F=\"#\"$ob\"pane_id\"$cb\" \"\"#\"$ob\"pane_floating_flag\"$cb; pn=$(tmux list-panes -F \"$F\" | sed \"/ 0\\$/!d; s/ .*//; s/^%//\" | sort -n | tail -1); if [ -n \"$pn\" ]; then tmux split-window -h -l \"62%\" -t \"%$pn\" \"ssh -t $host \\\"$c\\\"\"; else tmux split-window -h -l \"62%\" \"ssh -t $host \\\"$c\\\"\"; fi; else ssh -t \"$host\" \"$c\"; fi; else r=$(dirname \"$(dirname \"$rp\")\"); w=$(cat \"$rp/cwd\" 2>/dev/null); [ -d \"$w\" ] && r=$w; t=$TMUX; if [ -n \"$t\" ] && command -v tmux >/dev/null; then ob=$(printf \"\\173\"); cb=$(printf \"\\175\"); F=\"#\"$ob\"pane_id\"$cb\" \"\"#\"$ob\"pane_floating_flag\"$cb; pn=$(tmux list-panes -F \"$F\" | sed \"/ 0\\$/!d; s/ .*//; s/^%//\" | sort -n | tail -1); if [ -n \"$pn\" ]; then tmux split-window -h -l \"62%\" -c \"$r\" -t \"%$pn\" \"cd \\\"$r\\\" && exec \\\"$sh2\\\"\"; else tmux split-window -h -l \"62%\" -c \"$r\" \"cd \\\"$r\\\" && exec \\\"$sh2\\\"\"; fi; else cd \"$r\" && exec \"$sh2\"; fi; fi' sh '{split:	:6}'
"""


[actions.open_dir_tmux_v]
# Same as open_dir_tmux_h, but the split is below the newest pane
# instead of to its right. tmux's flags are easy to mix up: -v puts
