# rushi-sessions — a television channel that peeks at rushi sessions.
#
# Source of truth: /home/tony/programming/tv-rushi/rushi-sessions.toml
# Installed copy : ~/.config/television/cable/rushi-sessions.toml
# Reinstall      : cp /home/tony/programming/tv-rushi/rushi-sessions.toml \
#                     ~/.config/television/cable/rushi-sessions.toml
#
# Usage:
#   tv rushi-sessions [DIR]
#     DIR is television's [PATH] argument. tv chdirs into DIR before the
#     source command runs, so the scan root is:
#       - your current directory when DIR is omitted
#       - DIR when given, e.g. tv rushi-sessions ~/programming or /
#
# The binary takes optional scan roots: `rushi-sessions source ROOT...`.
# Each source command under [source] passes a different ROOT set to the
# same binary, so no flags are stacked. `CWD` passes no roots (the binary
# scans the CWD). Add `Local` and `All` commands to watch fixed trees.
# Home-manager users set the `programs."rushi-sessions".sourceRoots`
# option instead; the module generates these commands for them.
#
# The source commands run the `rushi-sessions` binary (one process per run).
# One `fd` call finds the session roots, then the same process does the rest:
# liveness via kill(pid, 0), last loop_phase from a tail read of
# events.jsonl, mtime for last-activity. No per-session forks. The scan
# roots are the ones the source command passes (below); without roots
# the binary scans the CWD. The binary prints one
# tab-separated line per session:
#   0 status  ACTIVE (live loop.pid) or IDLE
#   1 name    session name
#   2 repo    parent dir of the sessions/ dir (remote rows: host: prefix)
#   3 phase   last loop_phase from events.jsonl
#   4 last    last activity, mm-dd HH:MM
#   5 epoch   last activity, unix seconds (hidden sort key)
#   6 abs     absolute path to the session dir (used by preview/actions)
#
# The list shows status, repo/name, phase, last activity; remote rows
# carry the host in the repo field. The preview shows a status card
# (a `host` key under `repo` for remote rows) and the last few events.
# Full interaction happens in rushi-tui (the open action). The channel
# is a peek plus a message poke:
# send_message (ctrl-t) opens $EDITOR, then sends to the session: detached
# `rushi run` in the session's recorded working dir, idle or live.
# new_session (alt-n) opens $EDITOR, then creates a sibling session in
# the entry's project dir: detached `rushi run NAME MSG --sessions-root
# <project>/sessions` (rushi 0.1.1+; the working dir is the sessions
# root's parent). An empty message creates the session idle.
#
# Requirements: `fd` (hard, the binary's walk) and `rushi-sessions`
# (the backend binary, built by this repo's flake). `bat` is optional:
# the preview falls back to plain TOML when bat is absent. The interactive
# actions call binaries resolved on PATH, which are not listed as core
# requirements: `rushi` for send_message and new_session (0.1.1+ for the flags), `rushi-tui` for open/open_v,
# and `tmux` for open, open_v, open_dir_tmux_h and open_dir_tmux_v
# (used only when tv runs inside a tmux session; each detects $TMUX and
# falls back to the plain fork without it). `tv` itself for
# browse_events, which launches the nested rushi-sessions-events
# channel. That nested channel needs its own cable file
# (`rushi-sessions-events.toml`) and the `rushi-sessions` binary.
# send_message and new_session use `mktemp`, `stty`, `setsid`, `tr`
# and $EDITOR (fallback `nvim`); new_session adds `sed`, `head`,
# `tail` and `base64` (remote rows). All are in the standard Unix base.
#
# Remote roots: a source root may be `host:/path` or `user@host:/path`
# (an ssh alias). The binary runs the remote `rushi-sessions` over ssh
# and prefixes those rows' repo and path columns with `host:`. The
# actions branch on that prefix. The open actions split a pane in the
# LOCAL tmux server and run the remote TUI over `ssh -t`; the other
# actions act over `ssh -T`. This needs `ssh` plus the same
# `rushi-sessions` and `rushi` on the remote host. The open actions
# additionally need `rushi-tui` there, the open_dir_tmux actions need
# `tmux` there, and browse_events needs `tv` and this channel deployed
# there. A non-interactive ssh does not source the shell init, so a
# Nix profile on the remote is not on PATH. Set
# RUSHI_SESSIONS_REMOTE_BIN on the remote to name the binary, or use
# an absolute path.
#
# shell = "bash" is set on every command. television detects the login
# shell from $SHELL (fish here) and would otherwise run these commands
# under fish. The binary output carries real tabs; the string-pipeline
# templates split on that real tab (a TOML \t escape below becomes a real
# tab at parse time, matching the source output).

[metadata]
name = "rushi-sessions"
description = "Peek at rushi sessions: status, loop phase, last activity"
requirements = ["fd", "rushi-sessions"]

[source]
shell = "bash"
# One rushi-sessions process per run. Internally: one fd call finds the
# session roots (fast, parallel walk), then per-session liveness, phase
# and mtime in-process. No per-session forks.
#
# Named source commands: television runs the first on startup and cycles
# the rest on Ctrl+S (the `cycle_sources` keybinding). Each command passes
# a different ROOT set to the same binary, so no flags are stacked. This
# shipped copy is rootless, so it ships the single `CWD` command. Add
# `Local` and `All` commands (examples below) to enable the root views.
display = "[{split:\t:0}] {split:\t:2}/{split:\t:1} [{split:\t:3}] {split:\t:4}"
output = "{split:\t:6}"
frecency = false

[[source.command]]
# No scan roots: the binary scans the CWD.
name = "CWD"
run = "rushi-sessions source"

# Root views. Uncomment and add your roots to enable them. `Local` takes
# only the local roots; `All` takes the local + remote roots. A remote
# root is host:/path or user@host:/path (an ssh alias).
#
# [[source.command]]
# name = "Local"
# run = "rushi-sessions source /export ~/Downloads"
#
# [[source.command]]
# name = "All"
# run = "rushi-sessions source /export ~/Downloads build:/export"

[preview]
shell = "bash"
cached = true
# Structured TOML card, syntax-highlighted by bat when it is on PATH
# (theme override: RUSHI_PREVIEW_THEME, default "Catppuccin Macchiato"
# to match the catppuccin tv theme). Falls back to plain text when
# bat is absent.
command = "rushi-sessions preview '{split:\t:0}' '{split:\t:1}' '{split:\t:2}' '{split:\t:3}' '{split:\t:4}' '{split:\t:5}' '{split:\t:6}'"

[ui]
orientation = "portrait"

[ui.preview_panel]
size = 62
word_wrap = true

[keybindings]
ctrl-e = "actions:open"
ctrl-v = "actions:open_v"
alt-o = "actions:open_dir"
alt-d = "actions:open_dir_tmux_h"
alt-v = "actions:open_dir_tmux_v"
ctrl-t = "actions:send_message"
alt-k = "actions:kill"
alt-e = "actions:browse_events"
alt-n = "actions:new_session"

[actions.open]
# The TUI resolves a bare session name against a *relative* sessions_root,
# so it must start in the directory that contains the sessions tree.
# That project dir is the session's recorded `cwd` (where its tools
# run) walked up to the nearest ancestor holding a `sessions` dir.
# The path-based dirname(dirname(session_dir)) stays the fallback:
# it breaks when a git worktree symlinks `sessions` from the main
# worktree, because the session path lands in the main worktree
# while the session works in the worktree. Remote rows resolve the
# dir on the remote host with one `ssh -T` call.
#
# tv forks this action, so the fork inherits the pane environment. When
# tv runs inside tmux, TMUX is set: create a new pane in the current
# window. The pane sits to the right of tv (-h, a vertical split) and
# starts in the repo dir (-c). It runs rushi-tui there. The pane
# closes when rushi-tui exits. Outside tmux, or when the tmux binary
# is missing, keep the original behavior: it runs `cd` to the sessions
# root, then rushi-tui in this fork.
#
# A remote row (host: prefix) also opens a pane in the LOCAL tmux
# server, never on the remote one. The pane runs
# `ssh -t HOST "cd REPO && rushi-tui NAME"`: the remote TUI shows up
# next to tv, and the pane closes when it exits. No tmux server is
# needed on the remote host (the old behavior spawned a pane on the
# remote server, invisible to the user). Outside local tmux the fork
# runs the ssh command directly. The remote host needs `rushi-tui`
# reachable by a non-interactive ssh.
#
# The shell body stays brace-free: television's string pipeline treats a
# stray {group} as a template token and then leaves the {split:\t:6}
# placeholder unsubstituted. That is why the check reads plain $TMUX
# instead of ${TMUX:-}.
description = "Open this session in rushi-tui. Inside tmux, a new pane to the right of tv runs it from the session's repo dir. Outside tmux, it runs in this fork. Remote rows open the pane in the local tmux server: the pane runs the remote TUI over ssh -t."
shell = "bash"
mode = "fork"
command = """
sh -c 's=\"$1\"; host=\"\"; rp=\"$s\"; h=$(printf \"%s\" \"$s\" | cut -d: -f1); if [ \"$h\" != \"$s\" ]; then case \"$h\" in */*) : ;; *) host=\"$h\"; rp=$(printf \"%s\" \"$s\" | cut -d: -f2-);; esac; fi; if [ -n \"$host\" ]; then n=$(basename \"$rp\"); r=$(ssh -T \"$host\" \"w=\\$(cat \\\"$rp/cwd\\\" 2>/dev/null); if [ -d \\\"\\$w\\\" ]; then while [ ! -d \\\"\\$w/sessions\\\" ] && [ \\\"\\$w\\\" != / ]; do w=\\$(dirname \\\"\\$w\\\"); done; [ -d \\\"\\$w/sessions\\\" ] || w=\\$(dirname \\\"\\$(dirname \\\"$rp\\\")\\\"); else w=\\$(dirname \\\"\\$(dirname \\\"$rp\\\")\\\"); fi; printf \\\"%s\\\" \\\"\\$w\\\"\"); t=$TMUX; if [ -n \"$t\" ] && command -v tmux >/dev/null; then tmux split-window -h -l \"62%\" \"ssh -t $host \\\"cd $r && rushi-tui \\\\\\\"$n\\\\\\\"\\\"\"; else ssh -t \"$host\" \"cd $r && rushi-tui \\\"$n\\\"\"; fi; else n=$(basename \"$s\"); r=$(dirname \"$(dirname \"$s\")\"); w=$(cat \"$rp/cwd\" 2>/dev/null); if [ -d \"$w\" ]; then while [ ! -d \"$w/sessions\" ] && [ \"$w\" != / ]; do w=$(dirname \"$w\"); done; [ -d \"$w/sessions\" ] && r=$w; fi; t=$TMUX; if [ -n \"$t\" ] && command -v tmux >/dev/null; then tmux split-window -h -l \"62%\" -c \"$r\" \"rushi-tui \\\"$n\\\"\"; else cd \"$r\" && rushi-tui \"$n\"; fi; fi' sh '{split:\t:6}'
"""

[actions.open_v]
# Same as open, but the new pane stacks below tv instead of sitting to
# the right. tmux's flags are easy to mix up: -v puts the new pane below
# the current one (a horizontal divider). The remote-row behavior is the
# same ssh -t local pane, with the -v split.
description = "Open this session in rushi-tui. Inside tmux, a new pane below tv runs it from the session's repo dir. Outside tmux, it runs in this fork. Remote rows open the pane in the local tmux server: the pane runs the remote TUI over ssh -t."
shell = "bash"
mode = "fork"
command = """
sh -c 's=\"$1\"; host=\"\"; rp=\"$s\"; h=$(printf \"%s\" \"$s\" | cut -d: -f1); if [ \"$h\" != \"$s\" ]; then case \"$h\" in */*) : ;; *) host=\"$h\"; rp=$(printf \"%s\" \"$s\" | cut -d: -f2-);; esac; fi; if [ -n \"$host\" ]; then n=$(basename \"$rp\"); r=$(ssh -T \"$host\" \"w=\\$(cat \\\"$rp/cwd\\\" 2>/dev/null); if [ -d \\\"\\$w\\\" ]; then while [ ! -d \\\"\\$w/sessions\\\" ] && [ \\\"\\$w\\\" != / ]; do w=\\$(dirname \\\"\\$w\\\"); done; [ -d \\\"\\$w/sessions\\\" ] || w=\\$(dirname \\\"\\$(dirname \\\"$rp\\\")\\\"); else w=\\$(dirname \\\"\\$(dirname \\\"$rp\\\")\\\"); fi; printf \\\"%s\\\" \\\"\\$w\\\"\"); t=$TMUX; if [ -n \"$t\" ] && command -v tmux >/dev/null; then tmux split-window -v -l \"62%\" \"ssh -t $host \\\"cd $r && rushi-tui \\\\\\\"$n\\\\\\\"\\\"\"; else ssh -t \"$host\" \"cd $r && rushi-tui \\\"$n\\\"\"; fi; else n=$(basename \"$s\"); r=$(dirname \"$(dirname \"$s\")\"); w=$(cat \"$rp/cwd\" 2>/dev/null); if [ -d \"$w\" ]; then while [ ! -d \"$w/sessions\" ] && [ \"$w\" != / ]; do w=$(dirname \"$w\"); done; [ -d \"$w/sessions\" ] && r=$w; fi; t=$TMUX; if [ -n \"$t\" ] && command -v tmux >/dev/null; then tmux split-window -v -l \"62%\" -c \"$r\" \"rushi-tui \\\"$n\\\"\"; else cd \"$r\" && rushi-tui \"$n\"; fi; fi' sh '{split:\t:6}'
"""

[actions.open_dir]
# Exit tv and land in a shell at the session's project dir: the
# recorded `cwd` (the session's working dir) walked up to the nearest
# ancestor holding a `sessions` dir. The path-based
# dirname(dirname(session_dir)) stays the fallback for a missing or
# stale `cwd` file: a git worktree symlinks `sessions` from the main
# worktree, and the path rule would land in the main worktree.
# Uses mode = "execute" so tv quits and the command takes over the
# terminal; a fork would cd in a dead child and tv would just resume.
# Falls back to bash when $SHELL is unset.
description = "Exit tv and cd into the session's project dir; a $SHELL shell (bash fallback) takes over the terminal"
shell = "bash"
mode = "execute"
command = """
sh -c 's=\"$1\"; host=\"\"; rp=\"$s\"; h=$(printf \"%s\" \"$s\" | cut -d: -f1); if [ \"$h\" != \"$s\" ]; then case \"$h\" in */*) : ;; *) host=\"$h\"; rp=$(printf \"%s\" \"$s\" | cut -d: -f2-);; esac; fi; sh2=$SHELL; [ -n \"$sh2\" ] || sh2=bash; if [ -n \"$host\" ]; then r=$(ssh -T \"$host\" \"w=\\$(cat \\\"$rp/cwd\\\" 2>/dev/null); if [ -d \\\"\\$w\\\" ]; then while [ ! -d \\\"\\$w/sessions\\\" ] && [ \\\"\\$w\\\" != / ]; do w=\\$(dirname \\\"\\$w\\\"); done; [ -d \\\"\\$w/sessions\\\" ] || w=\\$(dirname \\\"\\$(dirname \\\"$rp\\\")\\\"); else w=\\$(dirname \\\"\\$(dirname \\\"$rp\\\")\\\"); fi; printf \\\"%s\\\" \\\"\\$w\\\"\"); ssh -t \"$host\" \"cd \\\"$r\\\" && exec $sh2\"; else r=$(dirname \"$(dirname \"$rp\")\"); w=$(cat \"$rp/cwd\" 2>/dev/null); if [ -d \"$w\" ]; then while [ ! -d \"$w/sessions\" ] && [ \"$w\" != / ]; do w=$(dirname \"$w\"); done; [ -d \"$w/sessions\" ] && r=$w; fi; cd \"$r\" && exec \"$sh2\"; fi' sh '{split:\t:6}'
"""

[actions.open_dir_tmux_h]
# Open a shell at the session's project dir in a tmux pane: the
# recorded `cwd` walked up to the nearest ancestor holding a
# `sessions` dir. The dirname(dirname(session_dir)) path rule stays
# the fallback, as in open_dir. The shell is $SHELL, with a bash
# fallback when $SHELL is unset.
#
# tv forks this action, so the fork inherits the pane environment. When
# tv runs inside tmux, TMUX is set: create a new pane in the current
# window. The pane sits to the right of tv (-h, a vertical split) and
# starts in the repo dir (-c). It runs the shell there. The pane closes
# when the shell exits. tmux runs the pane command through its default
# shell, so the pane command is the plain shell path. Outside tmux, or
# when the tmux binary is missing, the fork cds to the repo dir and execs
# the shell; tv resumes when the shell exits.
#
# A remote row (host: prefix) also opens a pane in the LOCAL tmux
# server, never on the remote one. The pane runs
# `ssh -t HOST "cd REPO && exec SHELL"`: a shell at the remote project
# dir shows up next to tv. No remote tmux server is needed. Outside
# local tmux the fork runs the ssh command directly. The shell name is
# the local $SHELL value (bash fallback), matching the old remote branch.
#
# The shell body stays brace-free: television's string pipeline treats a
# stray {group} as a template token and then leaves the {split:\t:6}
# placeholder unsubstituted. That is why the check reads plain $TMUX
# instead of ${TMUX:-}.
description = "Open a $SHELL shell (bash fallback) in the session's project dir. Inside tmux, a new pane to the right of tv runs it. Outside tmux, it runs in this fork; tv resumes when the shell exits. Remote rows open the pane in the local tmux server: the pane runs the remote shell over ssh -t."
shell = "bash"
mode = "fork"
command = """
sh -c 's=\"$1\"; host=\"\"; rp=\"$s\"; h=$(printf \"%s\" \"$s\" | cut -d: -f1); if [ \"$h\" != \"$s\" ]; then case \"$h\" in */*) : ;; *) host=\"$h\"; rp=$(printf \"%s\" \"$s\" | cut -d: -f2-);; esac; fi; sh2=$SHELL; [ -n \"$sh2\" ] || sh2=bash; if [ -n \"$host\" ]; then r=$(ssh -T \"$host\" \"w=\\$(cat \\\"$rp/cwd\\\" 2>/dev/null); if [ -d \\\"\\$w\\\" ]; then while [ ! -d \\\"\\$w/sessions\\\" ] && [ \\\"\\$w\\\" != / ]; do w=\\$(dirname \\\"\\$w\\\"); done; [ -d \\\"\\$w/sessions\\\" ] || w=\\$(dirname \\\"\\$(dirname \\\"$rp\\\")\\\"); else w=\\$(dirname \\\"\\$(dirname \\\"$rp\\\")\\\"); fi; printf \\\"%s\\\" \\\"\\$w\\\"\"); c=\"cd $r && exec $sh2\"; t=$TMUX; if [ -n \"$t\" ] && command -v tmux >/dev/null; then tmux split-window -h -l \"62%\" \"ssh -t $host \\\"$c\\\"\"; else ssh -t \"$host\" \"$c\"; fi; else r=$(dirname \"$(dirname \"$rp\")\"); w=$(cat \"$rp/cwd\" 2>/dev/null); if [ -d \"$w\" ]; then while [ ! -d \"$w/sessions\" ] && [ \"$w\" != / ]; do w=$(dirname \"$w\"); done; [ -d \"$w/sessions\" ] && r=$w; fi; t=$TMUX; if [ -n \"$t\" ] && command -v tmux >/dev/null; then tmux split-window -h -l \"62%\" -c \"$r\" \"$sh2\"; else cd \"$r\" && exec \"$sh2\"; fi; fi' sh '{split:\t:6}'
"""


[actions.open_dir_tmux_v]
# Same as open_dir_tmux_h, but the new pane stacks below tv instead of
# sitting to the right. tmux's flags are easy to mix up: -v puts the new
# pane below the current one (a horizontal divider). The remote-row
# behavior is the same ssh -t local pane, with the -v split. Outside
# tmux, the behavior is the same plain fork as open_dir_tmux_h.
description = "Open a $SHELL shell (bash fallback) in the session's project dir. Inside tmux, a new pane below tv runs it. Outside tmux, it runs in this fork; tv resumes when the shell exits. Remote rows open the pane in the local tmux server: the pane runs the remote shell over ssh -t."
shell = "bash"
mode = "fork"
command = """
sh -c 's=\"$1\"; host=\"\"; rp=\"$s\"; h=$(printf \"%s\" \"$s\" | cut -d: -f1); if [ \"$h\" != \"$s\" ]; then case \"$h\" in */*) : ;; *) host=\"$h\"; rp=$(printf \"%s\" \"$s\" | cut -d: -f2-);; esac; fi; sh2=$SHELL; [ -n \"$sh2\" ] || sh2=bash; if [ -n \"$host\" ]; then r=$(ssh -T \"$host\" \"w=\\$(cat \\\"$rp/cwd\\\" 2>/dev/null); if [ -d \\\"\\$w\\\" ]; then while [ ! -d \\\"\\$w/sessions\\\" ] && [ \\\"\\$w\\\" != / ]; do w=\\$(dirname \\\"\\$w\\\"); done; [ -d \\\"\\$w/sessions\\\" ] || w=\\$(dirname \\\"\\$(dirname \\\"$rp\\\")\\\"); else w=\\$(dirname \\\"\\$(dirname \\\"$rp\\\")\\\"); fi; printf \\\"%s\\\" \\\"\\$w\\\"\"); c=\"cd $r && exec $sh2\"; t=$TMUX; if [ -n \"$t\" ] && command -v tmux >/dev/null; then tmux split-window -v -l \"62%\" \"ssh -t $host \\\"$c\\\"\"; else ssh -t \"$host\" \"$c\"; fi; else r=$(dirname \"$(dirname \"$rp\")\"); w=$(cat \"$rp/cwd\" 2>/dev/null); if [ -d \"$w\" ]; then while [ ! -d \"$w/sessions\" ] && [ \"$w\" != / ]; do w=$(dirname \"$w\"); done; [ -d \"$w/sessions\" ] && r=$w; fi; t=$TMUX; if [ -n \"$t\" ] && command -v tmux >/dev/null; then tmux split-window -v -l \"62%\" -c \"$r\" \"$sh2\"; else cd \"$r\" && exec \"$sh2\"; fi; fi' sh '{split:\t:6}'
"""


[actions.send_message]
description = """
Open $EDITOR (falling back to nvim) on a message file, then send the result to the session with `rushi run <session> <msg>`: it starts the loop detached in the session's recorded working dir when the session is idle, and appends from that dir when the loop is live. An empty message cancels.
"""
shell = "bash"
mode = "fork"
command = """
sh -c 's=\"$1\"; host=\"\"; rp=\"$s\"; h=$(printf \"%s\" \"$s\" | cut -d: -f1); if [ \"$h\" != \"$s\" ]; then case \"$h\" in */*) : ;; *) host=\"$h\"; rp=$(printf \"%s\" \"$s\" | cut -d: -f2-);; esac; fi; if [ -n \"$host\" ]; then w=$(ssh -T \"$host\" \"w=\\$(cat \\\"$rp/cwd\\\" 2>/dev/null); [ -d \\\"\\$w\\\" ] || w=\\$(dirname \\\"\\$(dirname \\\"$rp\\\")\\\"); printf \\\"%s\\\" \\\"\\$w\\\"\"); p=$(ssh -T \"$host\" cat \"$rp/loop.pid\" 2>/dev/null); else w=$(cat \"$rp/cwd\" 2>/dev/null); [ -d \"$w\" ] || w=$(dirname \"$(dirname \"$rp\")\"); p=$(cat \"$rp/loop.pid\" 2>/dev/null); fi; p=$(printf \"%s\" \"$p\" | tr -d \"[:space:]\"); live=no; if [ -n \"$p\" ]; then if [ -n \"$host\" ]; then ssh -T \"$host\" kill -0 \"$p\" 2>/dev/null && live=yes; else kill -0 \"$p\" 2>/dev/null && live=yes; fi; fi; d=$TMPDIR; [ -n \"$d\" ] || d=/tmp; f=$(mktemp \"$d/tv-rushi-msg.XXXXXX\"); st=$(stty -g 2>/dev/null); ed=$EDITOR; [ -n \"$ed\" ] || ed=nvim; $ed \"$f\"; [ -n \"$st\" ] && stty \"$st\" 2>/dev/null || stty raw -echo 2>/dev/null; m=$(cat \"$f\" 2>/dev/null); rm -f \"$f\"; if [ -z \"$(printf \"%s\" \"$m\" | tr -d \"[:space:]\")\" ]; then echo \"No message entered, nothing sent.\"; exit 0; fi; if [ -n \"$host\" ]; then m64=$(printf \"%s\" \"$m\" | base64 | tr -d \"\\n\"); if [ \"$live\" = yes ]; then ssh -T \"$host\" \"cd \\\"$w\\\" && rushi run \\\"$rp\\\" \\\"\\$(printf %s $m64 | base64 -d)\\\"\"; else setsid ssh -T \"$host\" \"cd \\\"$w\\\" && rushi run \\\"$rp\\\" \\\"\\$(printf %s $m64 | base64 -d)\\\"\" </dev/null >/dev/null 2>&1 & fi; else cd \"$w\" && if [ \"$live\" = yes ]; then rushi run \"$rp\" \"$m\"; else setsid rushi run \"$rp\" \"$m\" </dev/null >/dev/null 2>&1 & fi; fi' sh '{split:\t:6}'
"""

[actions.browse_events]
# Fuzzy-search this session's events.jsonl in a nested `tv` (the
# `rushi-sessions-events` channel). The nested tv reads the session
# dir's events.jsonl from its CWD, so it must start there.
#
# tv forks this action, so the fork inherits the pane environment.
# When tv runs inside tmux, TMUX is set: create a new pane in the
# current window. The pane sits to the right of tv (-h, a vertical
# split) and starts in the session dir (-c). It runs the nested tv
# there. The pane closes when the nested tv exits. Outside tmux, or
# when the tmux binary is missing, the fork cds to the session dir
# and runs the nested tv here. The outer tv pauses and resumes when
# the nested tv exits.
#
# Remote rows (`host:` prefix) run the nested tv on the remote host
# over `ssh -t` (a pty, the nested tv is a TUI). The remote host
# must carry the same deployment of this channel (the same flake is
# deployed there).
#
# The shell body stays brace-free: television's string pipeline treats
# a stray {group} as a template token.
description = "Fuzzy-search this session's events.jsonl in a nested tv (the rushi-sessions-events channel). Inside tmux, a new pane to the right of tv runs it from the session dir. Outside tmux, it runs in this fork. Remote rows run it over ssh."
shell = "bash"
mode = "fork"
command = """
sh -c 's=\"$1\"; host=\"\"; rp=\"$s\"; h=$(printf \"%s\" \"$s\" | cut -d: -f1); if [ \"$h\" != \"$s\" ]; then case \"$h\" in */*) : ;; *) host=\"$h\"; rp=$(printf \"%s\" \"$s\" | cut -d: -f2-);; esac; fi; if [ -n \"$host\" ]; then ssh -t \"$host\" \"cd \\\"$rp\\\" && tv rushi-sessions-events\"; else t=$TMUX; if [ -n \"$t\" ] && command -v tmux >/dev/null; then tmux split-window -h -l "62%" -c \"$rp\" \"tv rushi-sessions-events\"; else cd \"$rp\" && tv rushi-sessions-events; fi; fi' sh '{split:\t:6}'
"""

[actions.kill]
description = "Stop the session loop (SIGTERM to the loop pid)"
shell = "bash"
mode = "fork"
command = """
sh -c 's=\"$1\"; host=\"\"; rp=\"$s\"; h=$(printf \"%s\" \"$s\" | cut -d: -f1); if [ \"$h\" != \"$s\" ]; then case \"$h\" in */*) : ;; *) host=\"$h\"; rp=$(printf \"%s\" \"$s\" | cut -d: -f2-);; esac; fi; if [ -n \"$host\" ]; then p=$(ssh -T \"$host\" cat \"$rp/loop.pid\" 2>/dev/null); p=$(printf \"%s\" \"$p\" | tr -d \"[:space:]\"); if [ -n \"$p\" ] && ssh -T \"$host\" kill -0 \"$p\" 2>/dev/null; then ssh -T \"$host\" kill -TERM \"$p\"; echo \"sent SIGTERM to $p (\"$(basename \"$rp\")\") on $host\"; else echo \"no live loop for \"$(basename \"$rp\")\" on $host (stale or absent pid)\"; fi; else p=$(cat \"$rp/loop.pid\" 2>/dev/null); p=$(printf \"%s\" \"$p\" | tr -d \"[:space:]\"); if [ -n \"$p\" ] && kill -0 \"$p\" 2>/dev/null; then kill -TERM \"$p\"; echo \"sent SIGTERM to $p (\"$(basename \"$rp\")\")\"; else echo \"no live loop for \"$(basename \"$rp\")\" (stale or absent pid)\"; fi; fi' sh '{split:\t:6}'
"""

[actions.new_session]
# Create a sibling session next to the selected entry. The prompt opens
# $EDITOR (fallback nvim) on a temp file: line 1 is the session name,
# the rest is the message. The project dir is the entry's own
# dirname(dirname(session_dir)): a new session anchors to the project
# where the entry lives, not to the entry's recorded cwd file (the
# decision-52 refinement stays with the actions that act on the
# existing session). rushi run takes --sessions-root <project>/sessions
# (rushi 0.1.1+), so the new session's recorded working dir is the
# sessions root's parent: the project dir itself.
#
# The prompt saves and restores the stty state around the editor launch,
# like send_message. An empty or unusable name cancels: an empty line 1,
# the comment line left in place (a # start), or a name that holds a /
# (it would create nested dirs) or is . or ..
#
# The loop starts detached (setsid + &, stdio to /dev/null): a new
# session has no live loop, so the kernel's rushi run blocks as the
# loop (decision 54's rationale). An empty message omits the task:
# the session is created idle.
#
# A remote row (host: prefix) prompts locally, resolves the project dir
# on the remote host with one read-only ssh -T call (dirname dirname of
# the session path), and creates the session there over ssh -T: the
# message passes as base64, the detached ssh backgrounds the remote
# loop. The remote host needs the same rushi (0.1.1+) on PATH.
#
# The shell body stays brace-free: television's string pipeline treats
# a stray {group} as a template token.
description = """
Create a new session next to the selected entry. The action opens $EDITOR (fallback nvim) on a temp file: line 1 is the session name, the rest is the message. The session lands in the entry's project dir: dirname(dirname(session dir)), sessions root <project>/sessions. It runs `rushi run NAME MSG --sessions-root <project>/sessions` from that project dir, detached (setsid + &, stdio to /dev/null). An empty message creates the session idle. An empty or unusable name (line 1 left as the comment, or it holds /, . or ..) cancels. Remote rows (host: prefix) prompt locally and create the session over ssh.
"""
shell = "bash"
mode = "fork"
command = """
sh -c 's=\"$1\"; host=\"\"; rp=\"$s\"; h=$(printf \"%s\" \"$s\" | cut -d: -f1); if [ \"$h\" != \"$s\" ]; then case \"$h\" in */*) : ;; *) host=\"$h\"; rp=$(printf \"%s\" \"$s\" | cut -d: -f2-);; esac; fi; if [ -n \"$host\" ]; then r=$(ssh -T \"$host\" \"printf \\\"%s\\\" \\\"\\$(dirname \\\"\\$(dirname \\\"$rp\\\")\\\")\\\"\"); else r=$(dirname \"$(dirname \"$rp\")\"); fi; d=$TMPDIR; [ -n \"$d\" ] || d=/tmp; f=$(mktemp \"$d/tv-rushi-new.XXXXXX\"); printf \"# line 1: session name, then the message\\n\" > \"$f\"; st=$(stty -g 2>/dev/null); ed=$EDITOR; [ -n \"$ed\" ] || ed=nvim; $ed \"$f\"; [ -n \"$st\" ] && stty \"$st\" 2>/dev/null || stty raw -echo 2>/dev/null; name=$(head -n1 \"$f\" | sed -e \"s/^[[:space:]]*//\" -e \"s/[[:space:]]*$//\"); m=$(tail -n +2 \"$f\"); rm -f \"$f\"; case \"$name\" in \"\"|\"#\"*|*/*|\".\"|\"..\") echo \"new_session: empty or unusable session name, nothing created.\"; exit 0;; esac; msg=$(printf \"%s\" \"$m\" | tr -d \"[:space:]\"); if [ -n \"$host\" ]; then m64=$(printf \"%s\" \"$m\" | base64 | tr -d \"\\n\"); if [ -n \"$msg\" ]; then setsid ssh -T \"$host\" \"cd \\\"$r\\\" && rushi run \\\"$name\\\" \\\"\\$(printf %s $m64 | base64 -d)\\\" --sessions-root \\\"$r/sessions\\\"\" </dev/null >/dev/null 2>&1 & echo \"new session $name starting in $r/sessions on $host\"; else setsid ssh -T \"$host\" \"cd \\\"$r\\\" && rushi run \\\"$name\\\" --sessions-root \\\"$r/sessions\\\"\" </dev/null >/dev/null 2>&1 & echo \"new idle session $name starting in $r/sessions on $host\"; fi; else cd \"$r\" 2>/dev/null || echo \"new_session: project dir $r missing, nothing created.\"; [ -d \"$r\" ] || exit 1; if [ -n \"$msg\" ]; then setsid rushi run \"$name\" \"$m\" --sessions-root \"$r/sessions\" </dev/null >/dev/null 2>&1 & echo \"new session $name starting in $r/sessions (working dir $r)\"; else setsid rushi run \"$name\" --sessions-root \"$r/sessions\" </dev/null >/dev/null 2>&1 & echo \"new idle session $name starting in $r/sessions (working dir $r)\"; fi; fi' sh '{split:	:6}'
"""
