# No top-level `watch` key: a reload resets the preview panel's
# scroll position, which blocks reading a rendered message.
# Television's CLI flag `tv rushi-sessions-events --watch N`
# enables the reload for one run.

# rushi-sessions-events — a television channel that fuzzy-searches one
# rushi session's events.jsonl.
#
# Launched by the `browse_events` action (alt-e) of the `rushi-sessions`
# channel, which gives the session dir as the CWD. It also works
# directly:
#   tv rushi-sessions-events /path/to/sessions/<session>
#   tv rushi-sessions-events        # CWD is the session dir
#
# The source commands run the `rushi-sessions` binary. `rushi-sessions
# events` prints one TSV row per entry of the CWD's events.jsonl,
# newest first:
#   0 seq     1-based line number of the entry in events.jsonl
#   1 type    the event type
#   2 ts      the local wall-clock time of the entry
#   3 summary the full one-line summary (the list side truncates)
#
# Two views: `User+Assistant` (the default, the first source command)
# lists only the user and assistant messages, and `All` lists every
# entry. Television runs the first command on startup and cycles the
# rest on Ctrl+S.
#
# The list shows [type] ts summary. The preview panel renders the
# selected entry as a document: markdown for user_message,
# assistant_message and compaction_summary, toml for tool_call,
# tool_result and everything else. The document pipes through a
# renderer. The ts of a document is local wall-clock time. The id of
# a user_message does not print. The call ids of a tool_call (the
# id and call_id keys) do not print. This file carries the baseline: `bat` with the per-entry
# language flag and the RUSHI_PREVIEW_THEME override (default theme
# "Catppuccin Macchiato", to match the catppuccin tv theme). When bat
# is absent, the document prints plain.
#
# The home-manager module builds this channel from
# rushi-sessions-events-channel.nix with the `eventPreviewer` and
# `eventTomlPreviewer` options. They replace the bat pipe with a
# user-chosen renderer (for example `mdcat` or `glow` for the
# markdown documents). The module also exposes `eventViewer` and
# `eventTomlViewer`, the viewers of the `view_message` action
# (for example `mdfried` and `bat`). That generated form is what
# the module installs; this repo copy is the manual-install
# baseline.
#
# Requirements: `rushi-sessions` (the source and preview commands) and
# `bat` (optional: the preview falls back to plain text without it).
# The action that launches this channel needs `tv` on PATH, resolved
# like the other interactive actions. The `send_message` action needs
# `rushi`, `stty`, `mv` and `$EDITOR` (fallback `nvim`), resolved on PATH,
# like the main channel's copy. The detached loop start uses `setsid`
# when it is on PATH and falls back to `nohup` otherwise (the macOS
# base has no setsid).
# The `view_message` action needs its viewers on PATH (`mdfried`
# and `bat` in this baseline copy).
#
# When tv runs inside tmux 3.8+, the prompt runs in a floating
# pane (`tmux new-pane -f`) above tv: the editor and the send step
# run in the pane, the pane dies on exit, the panes below keep
# rendering, and the fork returns at pane creation. The floating-pane
# path adds `cat` and a second `mktemp` (the pipeline file); the
# new-pane flags used are -f, -c, -x, -y, -X, -Y, -T and the
# multi-arg command form. The pane is not modal: copy-mode, window
# switching and the prefix bindings stay available while it is open.
# Below 3.8, or outside tmux, the pane editor runs instead.

[metadata]
name = "rushi-sessions-events"
description = "Fuzzy-search one session's events.jsonl entries and preview them"
requirements = ["rushi-sessions"]

[source]
shell = "bash"
display = "[{split:\t:1}] {split:\t:2} {split:\t:3}"
output = "{split:\t:0}"
frecency = false

[[source.command]]
# The default view (the first source command): only the user and
# assistant messages.
name = "User+Assistant"
# No path argument: the binary reads the CWD's events.jsonl.
run = "rushi-sessions events --chat"

[[source.command]]
# Every entry of the events.jsonl.
name = "All"
# No path argument: the binary reads the CWD's events.jsonl.
run = "rushi-sessions events"

[preview]
shell = "bash"
cached = true
# Plain document from the binary, then the renderer. The shell asks the
# binary for the language once (--print-lang) and picks the bat
# language flag. The theme override reads RUSHI_PREVIEW_THEME when set.
# A missing bat falls back to the plain document.
command = """
sh -c 'q=$1; l=$(rushi-sessions event-preview . \"$q\" --print-lang); t=$RUSHI_PREVIEW_THEME; if command -v bat >/dev/null 2>&1; then if [ -n \"$t\" ]; then th=\"--theme $t\"; else th=\"\"; fi; if [ \"$l\" = toml ]; then rushi-sessions event-preview . \"$q\" | bat --color=always -l toml --style=plain $th; else rushi-sessions event-preview . \"$q\" | bat --color=always -l markdown --style=plain $th; fi; else rushi-sessions event-preview . \"$q\"; fi' sh '{split:\t:0}'
"""

[ui]
orientation = "portrait"

[ui.preview_panel]
size = 62
word_wrap = true

[keybindings]
ctrl-t = "actions:send_message"
enter = "actions:view_message"

[actions.send_message]
# The session dir is the CWD of this channel: television chdirs to the
# [PATH] argument, and the main channel's browse_events action starts
# the nested tv in the session dir. The fork of this action inherits
# it. The source rows carry only the seq token, so the command takes
# no split placeholder. The body stays brace-free: television's string
# pipeline treats a stray {group} as a template token.
#
# The fork starts in the session dir, not the project dir, and the
# loop re-anchors the session's `cwd` file to the starter's CWD on
# every start. So the action cds to the recorded working dir first:
# the `cwd` file, or dirname(dirname(session_dir)) when the file is
# missing or its dir is gone. The live branch appends with a plain
# `rushi run` (the kernel branches on the session lock itself); the
# idle branch starts the loop detached (setsid when it is on PATH,
# the nohup fallback otherwise).
#
# When tv runs inside tmux 3.8+, the prompt runs in a `tmux new-pane`
# floating pane over tv: the pipeline (editor + send step) is written
# to a temp sh file and run as the pane's command; the values
# pass as its positional arguments. the pane dies when the pipeline exits. The pane is
# not modal: the panes below keep their layout, and copy-mode, window
# switching and the prefix bindings stay available. A broken
# pipeline is a visible pane flash, not a silent fallback. Tmux below
# 3.8, or running outside tmux, falls back to the pane editor.
description = """
Open $EDITOR (falling back to nvim) on a message file, then send the result to the session with `rushi run <session> <msg>`: it starts the loop detached in the session's recorded working dir when the session is idle, and appends from that dir when the loop is live. An empty message cancels. When tv runs inside tmux 3.8+, the editor and the send step run in a floating pane (`tmux new-pane -f`) above tv: the pane closes when the step exits, and the panes below keep rendering. Copy-mode and window switching stay available while the pane is open. Outside tmux, or on tmux below 3.8, the editor opens in the fork's pane as before. The prompt file carries a .md extension, so $EDITOR applies the markdown filetype. The editor opens in the session's recorded working dir, so typed relative paths complete against it.
"""
shell = "bash"
mode = "fork"
command = """
sh -c 'rp=$(pwd 2>/dev/null); if [ -z \"$rp\" ] || [ ! -d \"$rp\" ]; then echo \"rushi-sessions-events: cannot resolve the session dir (the channel CWD is gone); re-open it from a live directory.\"; exit 1; fi; w=$(cat \"$rp/cwd\" 2>/dev/null); [ -d \"$w\" ] || w=$(dirname \"$(dirname \"$rp\")\"); p=$(cat \"$rp/loop.pid\" 2>/dev/null); p=$(printf \"%s\" \"$p\" | tr -d \"[:space:]\"); live=no; if [ -n \"$p\" ]; then kill -0 \"$p\" 2>/dev/null && live=yes; fi; d=$TMPDIR; [ -n \"$d\" ] || d=/tmp; f=$(mktemp \"$d/tv-rushi-msg.XXXXXX\"); mv \"$f\" \"$f.md\"; f=\"$f.md\"; ed=$EDITOR; [ -n \"$ed\" ] || ed=nvim; tv=$(tmux -V 2>/dev/null); set -- $tv; v=$2; m=$(printf \"%s\" \"$v\" | cut -d. -f1); n=$(printf \"%s\" \"$v\" | cut -d. -f2); n=$(printf \"%s\" \"$n\" | tr -cd 0-9); tmo=no; if [ -n \"$TMUX\" ] && command -v tmux >/dev/null; then if [ \"$m\" -gt 3 ] 2>/dev/null; then tmo=yes; fi; if [ \"$m\" -eq 3 ] && [ \"$n\" -ge 8 ] 2>/dev/null; then tmo=yes; fi; fi;  if [ \"$tmo\" = yes ]; then g=$(mktemp \"$d/tv-rushi-pipe.XXXXXX\"); cat > \"$g\" <<PIPE
RP=\\$1; W=\\$2; LIVE=\\$3; F=\\$4; ED=\\$5; st=\\$(stty -g 2>/dev/null); \\$ED \"\\$F\"; [ -n \"\\$st\" ] && stty \"\\$st\" 2>/dev/null || stty raw -echo 2>/dev/null; m=\\$(cat \"\\$F\" 2>/dev/null); rm -f \"\\$F\"; if [ -z \"\\$(printf \"%s\" \"\\$m\" | tr -d \"[:space:]\")\" ]; then echo \"No message entered, nothing sent.\"; rm -f \"\\$0\"; exit 0; fi; cd \"\\$W\" && if [ \"\\$LIVE\" = yes ]; then rushi run \"\\$RP\" \"\\$m\"; echo \"message sent to \\$RP\"; sleep 2; else if command -v setsid >/dev/null 2>&1; then setsid rushi run \"\\$RP\" \"\\$m\" </dev/null >/dev/null 2>&1 & else nohup rushi run \"\\$RP\" \"\\$m\" </dev/null >/dev/null 2>&1 & fi; echo \"message queued for \\$RP\"; sleep 2; fi; rm -f \"\\$0\"
PIPE
tmux new-pane -f -c \"$w\" -x 80% -y 60% -X 10% -Y 20% -T \"tv-rushi message\" sh \"$g\" \"$rp\" \"$w\" \"$live\" \"$f\" \"$ed\"; exit 0; fi; st=$(stty -g 2>/dev/null); ed=$EDITOR; [ -n \"$ed\" ] || ed=nvim; if [ -n \"$w\" ]; then cd \"$w\" 2>/dev/null; fi; $ed \"$f\"; [ -n \"$st\" ] && stty \"$st\" 2>/dev/null || stty raw -echo 2>/dev/null; m=$(cat \"$f\" 2>/dev/null); rm -f \"$f\"; if [ -z \"$(printf \"%s\" \"$m\" | tr -d \"[:space:]\")\" ]; then echo \"No message entered, nothing sent.\"; exit 0; fi; cd \"$w\" && if [ \"$live\" = yes ]; then rushi run \"$rp\" \"$m\"; else if command -v setsid >/dev/null 2>&1; then setsid rushi run \"$rp\" \"$m\" </dev/null >/dev/null 2>&1 & else nohup rushi run \"$rp\" \"$m\" </dev/null >/dev/null 2>&1 & fi; fi'
"""

[actions.view_message]
# The fork pipes the selected entry's document into a viewer chosen
# from the entry's language and runs it in the pane: the viewer
# takes over the pane, then television resumes when it exits. The
# source rows carry the seq token, so the body takes one split
# placeholder, {split:\t:0}. The body asks the binary for the
# language once (--print-lang), then branches: markdown to the
# markdown viewer, toml to the toml viewer. This baseline copy
# pipes markdown into mdfried and toml into bat. The
# home-manager module exposes the viewers as the `eventViewer` and
# `eventTomlViewer` options.
description = """
View the selected entry in the channel's viewer. The fork picks the viewer from the entry's language: markdown goes to the eventViewer, toml goes to the eventTomlViewer. The viewer takes over the pane, and television resumes when the viewer exits. The baseline copy pipes markdown into mdfried and toml into bat. Set the options of the rushi-sessions home-manager module to pick the viewers.
"""
shell = "bash"
mode = "fork"
command = """
sh -c 'q=$1; l=$(rushi-sessions event-preview . \"$q\" --print-lang); if [ \"$l\" = toml ]; then rushi-sessions event-preview . \"$q\" | bat; else rushi-sessions event-preview . \"$q\" | mdfried; fi' sh '{split:\t:0}'
"""
