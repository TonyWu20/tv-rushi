# No top-level `watch` key: a reload resets the preview panel's
# scroll position, which blocks reading a rendered message.
# Television's CLI flag `tv rushi-sessions-events --watch N`
# enables the reload for one run.

# rushi-sessions-events — a television channel that fuzzy-searches one
# rushi session's events.jsonl.
#
# Launched by the `browse_events` action (alt-e) of the `rushi-sessions`
# channel, which gives the session dir as the CWD. It also works
# directly:
#   tv rushi-sessions-events /path/to/sessions/<session>
#   tv rushi-sessions-events        # CWD is the session dir
#
# The source commands run the `rushi-sessions` binary. `rushi-sessions
# events` prints one TSV row per entry of the CWD's events.jsonl,
# newest first:
#   0 seq     1-based line number of the entry in events.jsonl
#   1 type    the event type
#   2 ts      the local wall-clock time of the entry
#   3 summary the full one-line summary (the list side truncates)
#
# Two views: `User+Assistant` (the default, the first source command)
# lists only the user and assistant messages, and `All` lists every
# entry. Television runs the first command on startup and cycles the
# rest on Ctrl+S.
#
# The list shows [type] ts summary. The preview panel renders the
# selected entry as a document: markdown for user_message,
# assistant_message and compaction_summary, toml for tool_call,
# tool_result and everything else. The document pipes through a
# renderer. The ts of a document is local wall-clock time. The id of
# a user_message does not print. The call ids of a tool_call (the
# id and call_id keys) do not print. This file carries the baseline: `bat` with the per-entry
# language flag and the RUSHI_PREVIEW_THEME override (default theme
# "Catppuccin Macchiato", to match the catppuccin tv theme). When bat
# is absent, the document prints plain.
#
# The home-manager module builds this channel from
# rushi-sessions-events-channel.nix with the `eventPreviewer` and
# `eventTomlPreviewer` options. They replace the bat pipe with a
# user-chosen renderer (for example `mdcat` or `glow` for the
# markdown documents). That generated form is what the module
# installs; this repo copy is the manual-install baseline.
#
# Requirements: `rushi-sessions` (the source and preview commands) and
# `bat` (optional: the preview falls back to plain text without it).
# The action that launches this channel needs `tv` on PATH, resolved
# like the other interactive actions. The `send_message` action needs
# `rushi`, `setsid`, `stty` and `$EDITOR` (fallback `nvim`), resolved
# on PATH, like the main channel's copy.

[metadata]
name = "rushi-sessions-events"
description = "Fuzzy-search one session's events.jsonl entries and preview them"
requirements = ["rushi-sessions"]

[source]
shell = "bash"
display = "[{split:\t:1}] {split:\t:2} {split:\t:3}"
output = "{split:\t:0}"
frecency = false

[[source.command]]
# The default view (the first source command): only the user and
# assistant messages.
name = "User+Assistant"
# No path argument: the binary reads the CWD's events.jsonl.
run = "rushi-sessions events --chat"

[[source.command]]
# Every entry of the events.jsonl.
name = "All"
# No path argument: the binary reads the CWD's events.jsonl.
run = "rushi-sessions events"

[preview]
shell = "bash"
cached = true
# Plain document from the binary, then the renderer. The shell asks the
# binary for the language once (--print-lang) and picks the bat
# language flag. The theme override reads RUSHI_PREVIEW_THEME when set.
# A missing bat falls back to the plain document.
command = """
sh -c 'q=$1; l=$(rushi-sessions event-preview . \"$q\" --print-lang); t=$RUSHI_PREVIEW_THEME; if command -v bat >/dev/null 2>&1; then if [ -n \"$t\" ]; then th=\"--theme $t\"; else th=\"\"; fi; if [ \"$l\" = toml ]; then rushi-sessions event-preview . \"$q\" | bat --color=always -l toml --style=plain $th; else rushi-sessions event-preview . \"$q\" | bat --color=always -l markdown --style=plain $th; fi; else rushi-sessions event-preview . \"$q\"; fi' sh '{split:\t:0}'
"""

[ui.preview_panel]
size = 75
word_wrap = true

[keybindings]
ctrl-t = "actions:send_message"

[actions.send_message]
# The session dir is the CWD of this channel: television chdirs to the
# [PATH] argument, and the main channel's browse_events action starts
# the nested tv in the session dir. The fork of this action inherits
# it. The source rows carry only the seq token, so the command takes
# no split placeholder. The body stays brace-free: television's string
# pipeline treats a stray {group} as a template token.
description = """
Open $EDITOR (falling back to nvim) on a message file, then send the result to the session with `rushi run <session> <msg>`: it starts the loop detached when the session is idle, and appends with `--no-run` when the loop is live. An empty message cancels.
"""
shell = "bash"
mode = "fork"
command = """
sh -c 'rp=$(pwd); p=$(cat "$rp/loop.pid" 2>/dev/null); p=$(printf "%s" "$p" | tr -d "[:space:]"); live=no; if [ -n "$p" ]; then kill -0 "$p" 2>/dev/null && live=yes; fi; d=$TMPDIR; [ -n "$d" ] || d=/tmp; f=$(mktemp "$d/tv-rushi-msg.XXXXXX"); st=$(stty -g 2>/dev/null); ed=$EDITOR; [ -n "$ed" ] || ed=nvim; $ed "$f"; [ -n "$st" ] && stty "$st" 2>/dev/null || stty raw -echo 2>/dev/null; m=$(cat "$f" 2>/dev/null); rm -f "$f"; if [ -z "$(printf "%s" "$m" | tr -d "[:space:]")" ]; then echo "No message entered, nothing sent."; exit 0; fi; if [ "$live" = yes ]; then rushi run "$rp" "$m" --no-run; else setsid rushi run "$rp" "$m" </dev/null >/dev/null 2>&1 & fi'
"""
